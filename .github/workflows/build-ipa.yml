name: Build IPA Filmatura

# Genera un IPA NON FIRMATO, pronto per la firma con Sideloadly/AltStore/Xcode.
# Vedi README.md per le istruzioni di firma.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleziona Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Test su simulatore
        continue-on-error: true
        run: |
          xcodebuild test \
            -project Filmatura.xcodeproj \
            -scheme Filmatura \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release per device (non firmato)
        run: |
          xcodebuild \
            -project Filmatura.xcodeproj \
            -scheme Filmatura \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Pacchetto IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Filmatura.app Payload/
          zip -r Filmatura-unsigned.ipa Payload

      - name: Carica artefatto
        uses: actions/upload-artifact@v4
        with:
          name: Filmatura-ipa
          path: Filmatura-unsigned.ipa
          retention-days: 30

      - name: Deploy — pubblica l'IPA in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Aggiorna la release rollante "latest" con l'IPA nuova.
          # Dalla pagina Releases l'IPA si scarica senza login e non scade.
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag \
              || git push origin :refs/tags/latest || true
          fi
          gh release create latest Filmatura-unsigned.ipa \
            -R "$GITHUB_REPOSITORY" \
            --title "Filmatura — build corrente" \
            --notes "IPA **non firmata** dell'ultima build automatica. Scaricala, poi firmala con Sideloadly o AltStore (istruzioni nel README)." \
            --prerelease
